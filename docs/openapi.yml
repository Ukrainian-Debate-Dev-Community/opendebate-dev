openapi: 3.0.3
info:
  title: OpenDebate API
  description: >
    REST API for the OpenDebate backend — a record-keeping system for managing
    debates, from single club events to tournaments, with persistent users.

    All responses use the envelope `{status, data?, message?}` where `status`
    is `"success"` or `"fail"`/`"error"`. Deletion archives by default
    (`archived_at` timestamp); permanent deletion requires `?hard=true` and an
    Admin. Archived records are hidden from default queries, listable via
    `?include_archived=true`, and recoverable via `PATCH .../restore`.

    Every operation except register, login and the public event listing
    needs a bearer token: a missing, invalid or expired token, or one whose
    user no longer exists, is a 401. A path id that is not an integer (or
    any value Postgres cannot read as its column type) is a 400. Errors
    carry `{status, message}`; model validation failures (400) and unique
    violations (409) add `details`, one message per failed field.
  version: 2.0.0
servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: users
  - name: admins
  - name: organisations
  - name: formats
  - name: events
  - name: participants
  - name: organizers
  - name: teams
  - name: rounds
  - name: rooms
  - name: motions
  - name: scoring
  - name: standings
  - name: feedback
  - name: conflicts

paths:
  # ────────────────────────── users ──────────────────────────
  /users/register:
    post:
      tags: [users]
      summary: Register a new user
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          $ref: "#/components/responses/AuthSuccess"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/login:
    post:
      tags: [users]
      summary: Log in (rate limited)
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/password:
    put:
      tags: [users]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/username:
    put:
      tags: [users]
      summary: Change own username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users:
    delete:
      tags: [users]
      summary: Delete own account; event history stays, detached from it
      description: >
        Deletes the user row (204, no body). Every event participant row of
        the user survives with `user_id` set to null and its display name
        scrubbed to `deleted_user_<uuid>`, so rooms, scores and standings
        keep their history. Every foreign key to users cascades or sets
        null, so the anonymise-instead fallback (200 with a message) only
        happens if a future reference blocks the delete.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "204": { description: Account deleted; participations kept as guests }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/history:
    get:
      tags: [users]
      summary: Own past events, split by role
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/schedule:
    get:
      tags: [users]
      summary: Own upcoming events, split by role
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{id}/stats:
    get:
      tags: [users]
      summary: Aggregated speaker statistics for a user (visible rounds only)
      description: >
        `data` is null (with a message) for an existing user who never
        spoke in an event; an unknown user is a 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The user's speaker statistics, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/UserStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/claim-participant/{participantId}:
    post:
      tags: [users]
      summary: Claim a guest participant record with its claim token
      parameters:
        - $ref: "#/components/parameters/participantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token]
              properties:
                claim_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ────────────────────────── admins ──────────────────────────
  /admins/grant:
    post:
      tags: [admins]
      summary: Grant platform Admin to a user (Admin only)
      description: 400 when targetUserId is missing or the user is already an Admin.
      requestBody:
        $ref: "#/components/requestBodies/TargetUser"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admins/anonymise:
    post:
      tags: [admins]
      summary: Anonymise a user account, preserving historical results (Admin only)
      description: >
        Replaces the username with `deleted_user_<id>`, randomises the
        password, sets `is_deleted` and scrubs the display name of every
        linked event participant. Rooms, scores and standings stay intact.
        Unlike self-service account deletion this never hard-deletes the row.
      requestBody:
        $ref: "#/components/requestBodies/TargetUser"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admins/merge:
    post:
      tags: [admins]
      summary: Move one user's participations to another account (Admin only)
      description: >
        Moves every event participant row of the source user (archived ones
        too) to the target in one transaction, optionally renaming them to
        `displayName`, then anonymises the source like `/admins/anonymise`.
        400 for missing ids, the same id twice or an empty displayName; 404
        when either user is unknown or deleted; 409 when the source is an
        Admin, Owner or Organizer, or both users are registered in the same
        event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceUserId, targetUserId]
              properties:
                sourceUserId: { type: integer }
                targetUserId: { type: integer }
                displayName: { type: string }
      responses:
        "200":
          description: Number of participant rows moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      moved: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ────────────────────────── organisations ──────────────────────────
  /organisations:
    get:
      tags: [organisations]
      summary: List active organisations
      parameters:
        - $ref: "#/components/parameters/includeArchived"
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [organisations]
      summary: Create an organisation with an initial owner (Admin only)
      description: Names are not unique; 404 when owner_id is not a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_id]
              properties:
                name: { type: string }
                type: { type: string, enum: [academic, personal] }
                online: { type: boolean }
                link: { type: string, nullable: true }
                owner_id: { type: integer }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organisations/{organisationId}:
    parameters:
      - $ref: "#/components/parameters/organisationId"
    get:
      tags: [organisations]
      summary: Get one organisation with its owners
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [organisations]
      summary: Update an organisation (Owner)
      description: 404 for an unknown organisation, 403 for a non-owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [academic, personal] }
                online: { type: boolean }
                link: { type: string, nullable: true }
                status: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [organisations]
      summary: Archive an organisation (Admin; ?hard=true to purge)
      parameters:
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organisations/{organisationId}/stats:
    get:
      tags: [organisations]
      summary: Organisation-level statistics over completed events
      description: >
        `total_sessions` counts the organisation's completed events.
        `avg_winner_speaker_points` / `avg_fourth_place_speaker_points`
        average the summed speaker points of the rank-1 / rank-4 team per
        final room across those events (2 d.p., null when no room qualifies).
      parameters:
        - $ref: "#/components/parameters/organisationId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organisations/{organisationId}/restore:
    patch:
      tags: [organisations]
      summary: Restore an archived organisation (Admin)
      parameters:
        - $ref: "#/components/parameters/organisationId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organisations/{organisationId}/owners:
    post:
      tags: [organisations]
      summary: Add an owner (Owner)
      parameters:
        - $ref: "#/components/parameters/organisationId"
      requestBody:
        $ref: "#/components/requestBodies/TargetUser"
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organisations/{organisationId}/owners/{ownerId}:
    delete:
      tags: [organisations]
      summary: Remove an owner - the last owner cannot be removed (Admin)
      description: >
        404 when the user is not an owner of the organisation; 400 when
        they are its last owner.
      parameters:
        - $ref: "#/components/parameters/organisationId"
        - name: ownerId
          in: path
          required: true
          description: The owner's USER id (not an Owner row id)
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ────────────────────────── formats ──────────────────────────
  /formats:
    get:
      tags: [formats]
      summary: List formats
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [formats]
      summary: Create a format (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormatInput" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /formats/{formatId}:
    parameters:
      - $ref: "#/components/parameters/formatId"
    get:
      tags: [formats]
      summary: Get one format
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [formats]
      summary: Update a format (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormatInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [formats]
      summary: Archive a format (Admin; ?hard=true to purge, blocked while rooms use it)
      parameters:
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /formats/{formatId}/restore:
    patch:
      tags: [formats]
      summary: Restore an archived format (Admin)
      parameters:
        - $ref: "#/components/parameters/formatId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ────────────────────────── events ──────────────────────────
  /events:
    get:
      tags: [events]
      summary: Public event listing (no auth)
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, completed]
        - name: from
          in: query
          description: "Only events with start_date on or after this ISO date"
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "Only events with start_date on or before this ISO date"
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /events/organisation/{organisationId}:
    get:
      tags: [events]
      summary: List an organisation's events
      parameters:
        - $ref: "#/components/parameters/organisationId"
        - $ref: "#/components/parameters/includeArchived"
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/eventId"
    post:
      tags: [events]
      summary: Create an event in an organisation (Owner)
      description: >
        API quirk: for this POST the path parameter is the ORGANISATION id,
        not an event id — the route is `POST /events/:organisationId` sharing
        the URL shape of the event-detail routes. Dates are read as ISO
        dates or timestamps and returned as date-time (`2026-10-20T00:00:00.000Z`).
        404 for an unknown organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                start_date: { type: string, format: date, nullable: true }
                end_date: { type: string, format: date, nullable: true }
                is_ranked: { type: boolean }
      responses:
        "201":
          description: The created event
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    get:
      tags: [events]
      summary: Get one event (added in PR #60)
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [events]
      summary: Update an event (Owner/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                start_date: { type: string, format: date, nullable: true }
                end_date: { type: string, format: date, nullable: true }
                status:
                  type: string
                  enum: [scheduled, in_progress, completed]
                is_ranked: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [events]
      summary: Archive an event (Owner/Organizer; ?hard=true Admin-only purge)
      parameters:
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/restore:
    patch:
      tags: [events]
      summary: Restore an archived event (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/access:
    get:
      tags: [events]
      summary: Server-side privilege check for the current user on this event
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: Privilege flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      isPrivileged: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/eliminations:
    patch:
      tags: [events]
      summary: Mark teams and/or speaker participants (not) eliminated (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: boolean
                  description: true = eliminate, false = reinstate
                team_ids:
                  type: array
                  items: { type: integer }
                participant_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{eventId}/check-ins:
    patch:
      tags: [events]
      summary: Bulk (un)check-in participants (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, participant_ids]
              properties:
                status:
                  type: boolean
                  description: true = checked in, false = not checked in
                participant_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── rounds (event-scoped) ───
  /events/{eventId}/rounds:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [rounds]
      summary: List an event's rounds (ordered by sequence)
      parameters:
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [rounds]
      summary: Create a round (Owner/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sequence]
              properties:
                name: { type: string }
                sequence: { type: integer }
                is_hidden: { type: boolean }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/rounds/release-all:
    patch:
      tags: [rounds]
      summary: Un-hide every round of the event (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── standings (event-scoped) ───
  /events/{eventId}/standings/teams:
    get:
      tags: [standings]
      summary: Raw team ranks per room
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/standings/speakers:
    get:
      tags: [standings]
      summary: Raw speaker ranks per room
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/standings/calculated/teams:
    get:
      tags: [standings]
      summary: Calculated team standings (points derived from ranks)
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/standings/calculated/speakers:
    get:
      tags: [standings]
      summary: Calculated speaker standings
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── statistics (event-scoped) ───
  # Computed over rooms with a final ballot only ('completed', plus
  # 'confirmed' once ballot confirmation exists). Hidden rounds are
  # visible to admins/owners/organisers only, like the standings.
  /events/{eventId}/stats/speakers:
    get:
      tags: [standings]
      summary: Raw speaker-score statistics per speaker
      description: >
        Per speaker: number of rooms scored in (`rounds`), the sum (`total`),
        mean (`avg`) and population standard deviation (`std`, 2 d.p.) of
        their raw speaker scores. An iron-person's two speeches in one room
        both feed total/avg/std while counting that room once; speakers with
        no scores report avg/std as null.
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/stats/teams:
    get:
      tags: [standings]
      summary: Team statistics (summed speaker points, firsts and fourths)
      description: >
        Per team: `total_speaker_points` (sum of the team's speaker scores),
        `first_places` and `fourth_places` (count of rank-1 / rank-4 results).
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/stats/adjudicators:
    get:
      tags: [standings]
      summary: Adjudicator statistics (rooms adjudicated, average feedback)
      description: >
        Per adjudicator participant: `rooms_adjudicated` (final rooms they are
        assigned to) and `avg_feedback` (mean feedback score received in the
        event's final rooms, 2 d.p.; null without feedback). A feedback's
        score is the average of its answers to the event's counting questions
        when it has any, otherwise its stored score. With `base`, the base
        counts as one extra vote: (base + sum) / (count + 1), and an
        adjudicator without feedback gets the base.
      parameters:
        - $ref: "#/components/parameters/eventId"
        - name: base
          in: query
          required: false
          description: A number counted as one extra vote in each average.
          schema: { type: number, example: 5 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── teams (event-scoped) ───
  /events/{eventId}/teams:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [teams]
      summary: List an event's teams with members
      parameters:
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [teams]
      summary: Create a team (Owner/Organizer)
      description: Every participant must be a speaker of the event (400 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, participant_ids]
              properties:
                name: { type: string }
                participant_ids:
                  type: array
                  items: { type: integer }
                  description: Duplicates allowed (iron-person)
                is_temporary: { type: boolean, default: false }
                is_swing:
                  type: boolean
                  default: false
                  description: Swing teams fill empty slots and are excluded from team standings
      responses:
        "201":
          description: The created team (members are read via GET /teams)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Participant already in a permanent team, or name taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}/teams/auto-generate:
    get:
      tags: [teams]
      summary: Propose random teams from unassigned speakers (Owner/Organizer)
      description: >
        Attendance-aware — once at least one speaker of the event is checked
        in, only checked-in speakers are drafted; with no check-ins recorded
        every active speaker remains eligible.
      parameters:
        - $ref: "#/components/parameters/eventId"
        - name: format_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Proposed (not persisted) teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      total_free_speakers: { type: integer }
                      proposed_teams:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            participant_ids:
                              type: array
                              items: { type: integer }
                            participants:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: integer }
                                  display_name: { type: string }
                                  checked_in: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/eventId"
      - $ref: "#/components/parameters/teamId"
    put:
      tags: [teams]
      summary: Update a team (Owner/Organizer)
      description: >
        A new roster replaces the members (speakers of the event only) and
        is refused (400) while the team sits in a judging, completed or
        confirmed room; 409 when the name is taken or a member already
        belongs to another permanent team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                participant_ids:
                  type: array
                  items: { type: integer }
                is_swing: { type: boolean }
      responses:
        "200":
          description: The updated team (members are read via GET /teams)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [teams]
      summary: Archive a team — blocked while assigned to a room (Owner/Organizer; ?hard=true Admin)
      description: An unknown or already archived team is a 404.
      parameters:
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/teams/{teamId}/restore:
    patch:
      tags: [teams]
      summary: Restore an archived team (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/teamId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ─── participants (event-scoped) ───
  /events/{eventId}/participants:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [participants]
      summary: List event participants
      parameters:
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [participants]
      summary: Register a participant (platform user or guest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                user_id:
                  type: integer
                  nullable: true
                  description: Omit for a guest; a claim token is generated
                display_name: { type: string }
                role: { type: string, enum: [speaker, adjudicator] }
      responses:
        "201":
          description: >
            The participant; a guest's response also carries
            `raw_claim_token`, shown only this once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/participants/{participantId}:
    parameters:
      - $ref: "#/components/parameters/eventId"
      - $ref: "#/components/parameters/participantId"
    put:
      tags: [participants]
      summary: Update a participant (Owner/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                role: { type: string, enum: [speaker, adjudicator] }
      responses:
        "200":
          description: The updated participant
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [participants]
      summary: Archive a participant — blocked while assigned as room adjudicator (Owner/Organizer; ?hard=true Admin)
      description: >
        409 while the participant is on a team or a room adjudicator; an
        unknown or already archived participant is a 404.
      parameters:
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/participants/{participantId}/check-in:
    patch:
      tags: [participants]
      summary: Toggle a participant's check-in (Owner/Organizer, or the participant themselves)
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/participantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checked_in]
              properties:
                checked_in: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/participants/{participantId}/restore:
    patch:
      tags: [participants]
      summary: Restore an archived participant (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/participantId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ─── organizers (event-scoped) ───
  /events/{eventId}/organizers:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [organizers]
      summary: List event organizers
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [organizers]
      summary: Delegate event management to a user (Owner)
      description: >
        Every organizer has the same rights. A `role` field in the body is
        accepted and ignored: the engine keeps no organizer roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { type: integer }
                role:
                  type: string
                  description: Ignored; not stored.
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/organizers/{targetUserId}:
    delete:
      tags: [organizers]
      summary: Remove an organizer (Owner)
      parameters:
        - $ref: "#/components/parameters/eventId"
        - name: targetUserId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── conflicts (event-scoped) ───
  /events/{eventId}/conflicts:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [conflicts]
      summary: List event conflicts (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [conflicts]
      summary: Record a conflict — exactly one of target_participant_id / target_team_id (Owner/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_participant_id]
              properties:
                issuer_participant_id: { type: integer }
                target_participant_id: { type: integer, nullable: true }
                target_team_id: { type: integer, nullable: true }
                comment: { type: string, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/conflicts/{conflictId}:
    delete:
      tags: [conflicts]
      summary: Archive a conflict record (Owner/Organizer; ?hard=true Admin)
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/conflictId"
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/conflicts/{conflictId}/restore:
    patch:
      tags: [conflicts]
      summary: Restore an archived conflict record (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/conflictId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ─── motions (event-scoped) ───
  /events/{eventId}/motions:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [motions]
      summary: List motions — unreleased motion text is masked for unprivileged users
      description: >
        An event without motions gives an empty list; an unknown event is a
        404. Unprivileged users get each unreleased motion as a MaskedMotion.
      parameters:
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200":
          description: The event's motions
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/Motion"
                        - $ref: "#/components/schemas/MaskedMotion"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [motions]
      summary: Create a motion (Owner/Organizer)
      description: A keyword over 32 characters is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motion_text]
              properties:
                motion_text: { type: string }
                infoslide: { type: string, nullable: true }
                keyword: { type: string, nullable: true, maxLength: 32 }
                is_released: { type: boolean, default: false }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/motions/{motionId}:
    parameters:
      - $ref: "#/components/parameters/eventId"
      - $ref: "#/components/parameters/motionId"
    get:
      tags: [motions]
      summary: Get one motion — 403 while unreleased for unprivileged users
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [motions]
      summary: Update a motion (Owner/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motion_text: { type: string }
                infoslide: { type: string, nullable: true }
                keyword: { type: string, nullable: true, maxLength: 32 }
                is_released: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [motions]
      summary: Archive a motion — rooms keep their historical reference (Owner/Organizer; ?hard=true Admin)
      parameters:
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/motions/{motionId}/restore:
    patch:
      tags: [motions]
      summary: Restore an archived motion (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/motionId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ─── event feedback listing ───
  /events/{eventId}/feedback-questions:
    get:
      tags: [feedback]
      summary: The event's feedback form (any signed-in user)
      description: Questions in `position` order, then by id.
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [feedback]
      summary: Add a question to the event's feedback form (Owner/Organizer)
      description: >
        `min_value`/`max_value` apply to integer questions, `choices` to
        choice questions; only integer questions can `count_in_score`. The
        key is unique within the event (409 when taken). When an event has
        counting questions, its feedback is scored from the answers.
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackQuestionInput" }
            example:
              key: accuracy
              label: How accurate was the adjudicator's call?
              type: integer
              min_value: 1
              max_value: 10
              required: true
              counts_in_score: true
              position: 1
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/feedback-questions/{questionId}:
    parameters:
      - $ref: "#/components/parameters/eventId"
      - { name: questionId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [feedback]
      summary: Change a question (Owner/Organizer; 409 once it has answers)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackQuestionInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [feedback]
      summary: Remove a question (Owner/Organizer; 409 once it has answers)
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{eventId}/feedback:
    get:
      tags: [feedback]
      summary: List an event's adjudicator feedback (Owner/Organizer)
      description: >
        Each feedback carries `answers` ([{ key, label, value }]) and its
        `score`, computed from the counting answers when the event's form
        has any.
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/listPage"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ────────────────────────── rounds ──────────────────────────
  /rounds/{roundId}:
    parameters:
      - $ref: "#/components/parameters/roundId"
    get:
      tags: [rounds]
      summary: Get one round
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [rounds]
      summary: Update a round (Owner/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                sequence: { type: integer }
                status:
                  type: string
                  enum: [draft, scheduled, in_progress, completed]
                is_hidden: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [rounds]
      summary: Archive a round — blocked while in progress or completed (Owner/Organizer; ?hard=true Admin)
      parameters:
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rounds/{roundId}/restore:
    patch:
      tags: [rounds]
      summary: Restore an archived round (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/roundId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rounds/{roundId}/rooms:
    parameters:
      - $ref: "#/components/parameters/roundId"
    get:
      tags: [rooms]
      summary: List a round's rooms with teams, speakers, and adjudicators
      description: An unknown round gives an empty list.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [rooms]
      summary: Create a room from permanent and/or temporary teams (Owner/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format_id, teams, adjudicators]
              properties:
                format_id: { type: integer }
                motion_id: { type: integer, nullable: true }
                teams:
                  type: array
                  description: One entry per position; permanent (team_id) or temporary (participant_ids + name)
                  items:
                    type: object
                    required: [position]
                    properties:
                      position: { type: integer }
                      team_id: { type: integer }
                      participant_ids:
                        type: array
                        items: { type: integer }
                      name: { type: string }
                adjudicators:
                  type: array
                  description: At least one chair required
                  items:
                    type: object
                    required: [participant_id, role]
                    properties:
                      participant_id: { type: integer }
                      role:
                        type: string
                        enum: [chair, panelist, trainee]
      responses:
        "201":
          description: The created room
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ────────────────────────── rooms ──────────────────────────
  /rooms/{roomId}:
    delete:
      tags: [rooms]
      summary: Archive a room and its temporary teams — blocked while judging/completed/confirmed (Owner/Organizer; ?hard=true Admin)
      parameters:
        - $ref: "#/components/parameters/roomId"
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/restore:
    patch:
      tags: [rooms]
      summary: Restore an archived room together with its temporary teams (Owner/Organizer)
      parameters:
        - $ref: "#/components/parameters/roomId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/scores:
    post:
      tags: [scoring]
      summary: Submit or resubmit the room ballot (Chair or Admin)
      description: >
        Team ranks must be a permutation of 1..teams_per_room; speaker scores
        must cover every room speaker and respect the format's score bounds.
        On success the room status becomes `completed`. A `completed` room
        accepts resubmission as an atomic replace of the previous ballot;
        `confirmed` and `void` rooms reject submission. An iron-person (one
        speaker in both of a team's slots) gives two speeches: both count
        for the team, one of them (`is_iron`, by default the later slot)
        stays out of the speaker standings and stats. Marking a speech that
        is not an iron's, or both of an iron's, is a 400. The response
        carries a message only.
      parameters:
        - $ref: "#/components/parameters/roomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamRankings, speakerScores]
              properties:
                teamRankings:
                  type: array
                  items:
                    type: object
                    required: [room_team_id, rank]
                    properties:
                      room_team_id: { type: integer }
                      rank: { type: integer }
                speakerScores:
                  type: array
                  items:
                    type: object
                    required: [room_speaker_id, score]
                    properties:
                      room_speaker_id: { type: integer }
                      score: { type: number }
                      is_iron:
                        type: boolean
                        description: This iron-person's speech counts for the team only.
                      participant_id:
                        type: integer
                        description: >
                          The team member who actually gave this speech, when it
                          differs from the draw. A member giving both of the team's
                          speeches is an iron-person; anyone outside the team is a 400.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/motion:
    post:
      tags: [rooms]
      summary: Judge sets this room's motion (Chair; Owner/Organizer fall-through)
      description: >
        Creates a released event motion and attaches it to the room in one
        transaction, while the room is `pending` or `judging`. Rooms carry
        their own motion_id, so rooms of one round can debate different
        motions (club sessions). An optional `prep_ends_at` sets when the
        room's prep ends in the same transaction (null clears it; absent
        leaves it unchanged); the response carries the room's value. Each
        call creates a new event motion; the room's previous one stays in
        the event. A keyword over 32 characters is a 400.
      parameters:
        - $ref: "#/components/parameters/roomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motion_text]
              properties:
                motion_text: { type: string }
                infoslide: { type: string, nullable: true }
                keyword: { type: string, nullable: true, maxLength: 32 }
                prep_ends_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: When prep ends and the debate starts.
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/prep:
    patch:
      tags: [rooms]
      summary: Move or clear when the room's prep ends (Chair; Owner/Organizer fall-through)
      description: >
        Sets `prep_ends_at` (a timestamp, or null for no prep clock) while
        the room is `pending` or `judging`. Room reads
        (`/rounds/{roundId}/rooms`) carry the value.
      parameters:
        - $ref: "#/components/parameters/roomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prep_ends_at]
              properties:
                prep_ends_at: { type: string, format: date-time, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/confirm:
    patch:
      tags: [scoring]
      summary: Confirm a submitted ballot, locking the room (Owner/Organizer/Admin)
      description: >
        Moves a `completed` room to `confirmed`. A confirmed room rejects
        score resubmission until it is unconfirmed.
      parameters:
        - $ref: "#/components/parameters/roomId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/unconfirm:
    patch:
      tags: [scoring]
      summary: Unlock a confirmed ballot back to completed (Owner/Organizer/Admin)
      parameters:
        - $ref: "#/components/parameters/roomId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/feedback:
    post:
      tags: [feedback]
      summary: Submit feedback about a room adjudicator
      description: >
        Exactly one of issuer_participant_id / issuer_team_id must be set.
        `answers` answer the event's feedback questions by key; every required
        question must be answered and each value must fit its question. When
        the event has counting questions, `score` is not accepted and the
        feedback's score is the average of the counting answers; otherwise
        `score` is required as before. The response carries `answers` and the
        computed `score`.
      parameters:
        - $ref: "#/components/parameters/roomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjudicator_id]
              properties:
                adjudicator_id: { type: integer }
                issuer_participant_id: { type: integer, nullable: true }
                issuer_team_id: { type: integer, nullable: true }
                score:
                  type: integer
                  description: Required unless the event's form scores feedback.
                comment: { type: string, nullable: true }
                answers:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string }
                      value:
                        description: integer, string, boolean or one of the choices
            example:
              adjudicator_id: 12
              issuer_team_id: 40
              comment: The call was right; the closings needed more comparison.
              answers:
                - { key: accuracy, value: 7 }
                - { key: reasoning, value: 8 }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ────────────────────────── feedback moderation ──────────────────────────
  /feedback/{feedbackId}:
    delete:
      tags: [feedback]
      summary: Archive a feedback record (Admin; ?hard=true to purge)
      parameters:
        - $ref: "#/components/parameters/feedbackId"
        - $ref: "#/components/parameters/hard"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /feedback/{feedbackId}/restore:
    patch:
      tags: [feedback]
      summary: Restore an archived feedback record (Admin)
      description: >
        Returns the stored row: `score` is as stored (null when the event's
        form scores feedback from its answers) and there are no `answers`;
        the event feedback listing shows the computed score and answers.
      parameters:
        - $ref: "#/components/parameters/feedbackId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    organisationId:
      name: organisationId
      in: path
      required: true
      schema: { type: integer }
    eventId:
      name: eventId
      in: path
      required: true
      schema: { type: integer }
    roundId:
      name: roundId
      in: path
      required: true
      schema: { type: integer }
    roomId:
      name: roomId
      in: path
      required: true
      schema: { type: integer }
    teamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer }
    participantId:
      name: participantId
      in: path
      required: true
      schema: { type: integer }
    motionId:
      name: motionId
      in: path
      required: true
      schema: { type: integer }
    conflictId:
      name: conflictId
      in: path
      required: true
      schema: { type: integer }
    feedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { type: integer }
    formatId:
      name: formatId
      in: path
      required: true
      schema: { type: integer }
    hard:
      name: hard
      in: query
      required: false
      description: "true = permanently delete instead of archiving (Admin only)"
      schema: { type: boolean }
    includeArchived:
      name: include_archived
      in: query
      required: false
      description: "true = include archived records (marked by non-null archived_at)"
      schema: { type: boolean }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 5 }
    listPage:
      name: page
      in: query
      description: "Page number (used only when limit is provided)"
      schema: { type: integer, default: 1 }
    listLimit:
      name: limit
      in: query
      description: >-
        Opt-in pagination: when set (1-100), the listing is sliced;
        when omitted, the complete list is returned. The last page is
        signalled by fewer rows than the limit.
      schema: { type: integer, minimum: 1, maximum: 100 }

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string }
              password: { type: string }
    TargetUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetUserId]
            properties:
              targetUserId: { type: integer }

  responses:
    Success:
      description: Success envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    AuthSuccess:
      description: Authenticated — token included
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  token: { type: string }
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid token or credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient privileges
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Record not found (or archived, on default queries)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict (duplicate, dependency, already archived…)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Message:
      description: Success with a message and no data
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [success] }
              message: { type: string }

  schemas:
    FeedbackQuestionInput:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,49}$" }
        label: { type: string }
        type: { type: string, enum: [integer, text, boolean, choice] }
        min_value: { type: integer, nullable: true }
        max_value: { type: integer, nullable: true }
        choices: { type: array, items: { type: string }, nullable: true }
        required: { type: boolean, default: false }
        counts_in_score: { type: boolean, default: false }
        position: { type: integer, default: 0 }
    Envelope:
      type: object
      properties:
        status: { type: string, enum: [success] }
        message: { type: string }
        data:
          description: Entity or array of entities (or null); shape depends on the endpoint
    Error:
      type: object
      properties:
        status: { type: string, enum: [fail, error] }
        message: { type: string }
        details:
          type: array
          items: { type: string }
          description: >
            Present on model validation errors (400) and unique violations
            (409): one message per failed field.
    Event:
      allOf:
        - type: object
          properties:
            id: { type: integer }
            organisation_id: { type: integer }
            name: { type: string }
            start_date: { type: string, format: date-time, nullable: true }
            end_date: { type: string, format: date-time, nullable: true }
            status: { type: string, enum: [scheduled, in_progress, completed] }
            is_ranked: { type: boolean }
        - $ref: "#/components/schemas/Archivable"
    Participant:
      allOf:
        - type: object
          description: The guest claim token hash is never returned.
          properties:
            id: { type: integer }
            event_id: { type: integer }
            user_id: { type: integer, nullable: true }
            display_name: { type: string }
            role: { type: string, enum: [speaker, adjudicator] }
            is_eliminated: { type: boolean }
            checked_in: { type: boolean }
            claim_token_used_at: { type: string, format: date-time, nullable: true }
            raw_claim_token:
              type: string
              description: Only in the response that creates a guest
        - $ref: "#/components/schemas/Archivable"
    Team:
      allOf:
        - type: object
          properties:
            id: { type: integer }
            event_id: { type: integer }
            name: { type: string }
            is_temporary: { type: boolean }
            is_eliminated: { type: boolean }
            is_swing: { type: boolean }
        - $ref: "#/components/schemas/Archivable"
    Room:
      allOf:
        - type: object
          properties:
            id: { type: integer }
            round_id: { type: integer }
            format_id: { type: integer }
            motion_id: { type: integer, nullable: true }
            prep_ends_at: { type: string, format: date-time, nullable: true }
            status:
              type: string
              enum: [pending, live, judging, completed, confirmed, void]
        - $ref: "#/components/schemas/Archivable"
    Motion:
      allOf:
        - type: object
          properties:
            id: { type: integer }
            event_id: { type: integer }
            motion_text: { type: string }
            infoslide: { type: string, nullable: true }
            keyword: { type: string, nullable: true, maxLength: 32 }
            is_released: { type: boolean }
        - $ref: "#/components/schemas/Archivable"
    MaskedMotion:
      type: object
      description: >
        An unreleased motion as unprivileged users see it: placeholder
        text, null infoslide and keyword, and no timestamps.
      properties:
        id: { type: integer }
        event_id: { type: integer }
        motion_text: { type: string, example: Motion will be revealed later. }
        infoslide: { type: string, nullable: true }
        keyword: { type: string, nullable: true }
        is_released: { type: boolean, enum: [false] }
    UserStats:
      type: object
      nullable: true
      properties:
        overview:
          type: object
          properties:
            total_ballots_received: { type: integer }
            total_debates_ranked: { type: integer }
            average_speaker_score: { type: number, example: 77.4 }
            highest_score: { type: number }
            lowest_score: { type: number }
        placements:
          type: object
          properties:
            first_places: { type: integer }
            win_rate_percentage: { type: number, example: 27.3 }
    Archivable:
      type: object
      description: Mixin present on all archivable entities
      properties:
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: null = live; set = archived
        created_at:
          type: string
          format: date-time
          nullable: true
          description: null on rows predating timestamping (PR #59)
        updated_at:
          type: string
          format: date-time
          nullable: true
    FormatInput:
      type: object
      required: [name, code, teams_per_room, speakers_per_team, score_min, score_max]
      properties:
        name: { type: string }
        code: { type: string, maxLength: 10 }
        teams_per_room: { type: integer }
        speakers_per_team: { type: integer }
        has_reply: { type: boolean, default: false }
        score_min: { type: integer }
        score_max: { type: integer }
